name: Bundle storefront photography
on:
  push:
    paths:
      - '.github/workflows/bundle-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate photos locally
        run: |
          python3 - <<'PY'
          import urllib.request, os, struct
          photos = {
            'hero-garden.jpg':'https://images.unsplash.com/photo-1558904541-efa843a96f01?auto=format&fit=crop&w=1800&q=82',
            'aerator-photo.jpg':'https://images.unsplash.com/photo-1416879595882-3373a0480b5b?auto=format&fit=crop&w=900&q=80',
            'sprinkler-photo.jpg':'https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=900&q=80',
          }
          os.makedirs('assets',exist_ok=True)
          for name,url in photos.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=25) as resp: data=resp.read()
              if len(data)<15000 or data[:3]!=b'\xff\xd8\xff': raise ValueError('not a valid JPEG')
              with open('assets/'+name,'wb') as out: out.write(data)
              print(name,len(data),'bytes')
            except Exception as e:
              print('WARNING',name,e)
          PY
      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Bundle verified JPEG photos for Garden Pro"
            git push
          fi
